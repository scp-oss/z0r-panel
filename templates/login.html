{% extends "base.html" %}
{% block title %}Zenith — вход{% endblock %}
{% block content %}
<div class="card" style="max-width:320px;margin:60px auto;">
  <h2>Вход</h2>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <p><input name="username" placeholder="логин" autofocus style="width:100%"></p>
    <p><input name="password" type="password" placeholder="пароль" style="width:100%"></p>
    <p><button type="submit" style="width:100%">Войти</button></p>
  </form>
</div>
{% endblock %}
