<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Zenith{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #14161a; color: #e6e6e6; font-size: 14px;
  }
  /* Раньше — верхняя горизонтальная шапка со всеми ссылками в ряд.
     С ростом числа разделов (Дашборд/Ноды/База знаний/РКН/Управление
     из двух вкладок) это стало тесно и не давало сгруппировать
     "Управление" отдельно от остальных разделов. Левый сайдбар вместо
     этого: секции группируются заголовками, активный пункт виден сразу,
     на мобильном (см. media query внизу) сворачивается обратно в
     горизонтальную полосу сверху. */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: #1b1e24; border-right: 1px solid #2a2e37;
    padding: 18px 12px; display: flex; flex-direction: column; gap: 1px;
  }
  .sidebar .brand { font-weight: 700; font-size: 17px; padding: 4px 10px 16px; color: #e6e6e6; }
  .sidebar a {
    color: #9fb4ff; text-decoration: none; padding: 8px 10px; border-radius: 6px; font-weight: 500;
  }
  .sidebar a:hover { background: #22252c; text-decoration: none; }
  .sidebar a.active { background: #2c3550; color: #fff; }
  .sidebar .group-label {
    font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: .04em;
    margin: 16px 0 2px; padding: 0 10px;
  }
  .sidebar .spacer { flex: 1; }
  .sidebar .user { color: #888; font-size: 12px; padding: 12px 10px 4px; border-top: 1px solid #2a2e37; margin-top: 8px; }
  .sidebar .user a { padding: 0; display: inline; font-weight: 400; }
  .content-area { flex: 1; min-width: 0; }
  main { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
  h1, h2, h3 { font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 24px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #2a2e37; text-align: left; vertical-align: top; }
  /* Таблицы на телефоне часто шире экрана (обзор, ноды, история мутаций) --
     каждая обёрнута в .table-wrap (см. шаблоны), скроллится сама по себе
     вместо того, чтобы раздвигать всю страницу вбок. table{display:block}
     без обёртки — известный хак, но ломает выравнивание колонок в
     некоторых браузерах, поэтому обёртка-div, а не он. */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0 24px; }
  .table-wrap table { margin: 0; }
  /* Длинные списки (боевой РКН-хостлист — сотни/тысячи строк) раньше
     растягивали всю страницу вниз, чтобы дойти до следующего блока
     приходилось пролистывать весь список. Фиксированная высота + свой
     скролл + "прилипающий" заголовок колонок. */
  .table-wrap.scroll-box { max-height: 420px; overflow-y: auto; }
  .table-wrap.scroll-box th { position: sticky; top: 0; background: #1b1e24; z-index: 1; }
  th { color: #9aa0ac; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #1c1f26; }
  code, .mono { font-family: SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
    background: #2a2e37; color: #ccc;
  }
  .pill.prod { background: #37331f; color: #e0c060; }
  .pill.remote { background: #1f3337; color: #5ec9d6; }
  .pill.ok { background: #1f3722; color: #6fd67d; }
  .pill.warn { background: #3a2620; color: #e08a5f; }
  a.gid { color: #9fb4ff; }
  form.inline { display: inline; }
  input, select, button {
    background: #22252c; border: 1px solid #363b46; color: #e6e6e6;
    padding: 6px 10px; border-radius: 6px; font-size: 13px; max-width: 100%;
  }
  button { cursor: pointer; background: #2c3550; border-color: #3d4a72; }
  button:hover { background: #34406b; }
  /* Опасные/боевые действия (restart zapret2, удаление, включение
     автопродвижения, добавление в боевой РКН-список) визуально отличались
     от обычных кнопок ТОЛЬКО confirm()-диалогом -- легко прощёлкать не
     читая. Явный красноватый акцент, тот же confirm остаётся как вторая
     линия защиты, не замена. */
  button.danger { background: #3a2620; border-color: #6b3a2a; color: #f0c8b0; }
  button.danger:hover { background: #4a2e28; }
  /* Прогресс-бар прогона подбора (см. /controls "Запустить подбор") --
     сплошная заливка = раунд только что завершён, готовится следующий;
     полосатая анимированная = сам раунд сейчас считается (геном уже
     применён в песочнице, ждём settle+пробу) -- см. runner.py
     pending_round за объяснением разрыва, который это визуализирует. */
  .progress-bar { background: #22252c; border: 1px solid #363b46; border-radius: 6px; height: 10px; overflow: hidden; margin: 10px 0; }
  .progress-bar-fill { height: 100%; background: #3d5aa8; transition: width .3s ease; }
  .progress-bar-fill.pending {
    background-image: repeating-linear-gradient(45deg, #3d5aa8, #3d5aa8 10px, #34406b 10px, #34406b 20px);
    background-size: 28px 28px; animation: progress-stripes 1s linear infinite;
  }
  @keyframes progress-stripes { from { background-position: 0 0; } to { background-position: 28px 0; } }
  .card {
    background: #1b1e24; border: 1px solid #2a2e37; border-radius: 8px;
    padding: 16px 20px; margin-bottom: 20px;
  }
  /* Карточка, где действия меняют РЕАЛЬНЫЙ трафик/прод (не просто тест) --
     видимая тонкая рамка-предупреждение сразу отличает её от обычных
     read-only/тестовых карточек, до того как читать текст внутри. */
  .card.danger-zone { border-color: #5c3324; }
  /* Быстрая внутристраничная навигация -- используется на длинных
     страницах с несколькими независимыми карточками подряд (сейчас —
     "Стратегии"), чтобы не листать вручную. */
  .quicknav {
    display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 20px;
    padding: 10px 14px; background: #1b1e24; border: 1px solid #2a2e37;
    border-radius: 8px; font-size: 13px;
  }
  .quicknav a { color: #9fb4ff; text-decoration: none; }
  .quicknav a:hover { text-decoration: underline; }
  .muted { color: #888; }
  .token-box {
    font-family: monospace; background: #0f1a12; border: 1px solid #2e5c3a;
    color: #8fe6a0; padding: 12px; border-radius: 6px; word-break: break-all;
  }
  .flash { padding: 8px 14px; border-radius: 6px; margin-bottom: 16px; background: #2a2e37; }
  .flash.error { background: #3a2620; color: #e08a5f; }
  /* Провайдеры/номера боевых strategy= -- размыты по умолчанию (скриншот
     панели не должен светить, у кого какой провайдер и какая стратегия
     сейчас залочена), клик по конкретной ячейке снимает блюр только с
     неё. См. base.html script ниже -- один делегированный обработчик на
     весь документ, каждая страница просто помечает нужные элементы
     классом "blur", ничего больше подключать не нужно. Подсказка через
     чистый CSS :hover -- не нужно трогать разметку на каждой странице,
     где встречается .blur.*/
  .blur { filter: blur(5px); cursor: pointer; transition: filter .12s ease; position: relative; }
  .blur.revealed { filter: none; }
  .blur:not(.revealed):hover::after {
    content: "нажми, чтобы посмотреть"; position: absolute; left: 0; top: 100%;
    background: #22252c; border: 1px solid #363b46; color: #ccc; padding: 2px 6px;
    border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10; filter: none;
  }
  /* Формы с НЕСКОЛЬКИМИ inline-полями в один ряд (тест доменов, ручное
     переключение стратегии, добавление в РКН-список) раньше не
     переносились на мобильном -- поля вылезали за край карточки вместо
     аккуратного переноса строк. Явный класс, не общий "form" -- логин
     (стек из <p> в столбик) и одиночные кнопки-формы полагаются на
     обычную блочную раскладку, ломать их flex'ом не нужно. */
  form.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* Сайдбар сворачивается в горизонтальную полосу сверху -- та же идея,
     что была у прежней шапки, просто теперь это fallback для узких
     экранов, а не основной вид. */
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; overflow-x: auto;
      white-space: nowrap; border-right: none; border-bottom: 1px solid #2a2e37;
      padding: 8px 12px; gap: 4px;
    }
    .sidebar .brand { display: none; }
    .sidebar .group-label { display: none; }
    .sidebar .spacer { display: none; }
    .sidebar .user { border-top: none; margin-top: 0; padding: 8px 10px; white-space: nowrap; }
    main { padding: 16px; }
  }
  @media (max-width: 640px) {
    main { padding: 12px; }
    .card { padding: 12px; }
    th, td { padding: 5px 6px; font-size: 13px; }
    code, .mono { font-size: 11.5px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Zenith</div>
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Дашборд</a>
    <a href="/nodes" {% if request.url.path.startswith('/nodes') %}class="active"{% endif %}>Ноды</a>
    <a href="/knowledge" {% if request.url.path.startswith('/knowledge') %}class="active"{% endif %}>База знаний</a>
    <a href="/rkn" {% if request.url.path.startswith('/rkn') %}class="active"{% endif %}>РКН список</a>
    <a href="/custom-domains" {% if request.url.path.startswith('/custom-domains') %}class="active"{% endif %}>Кастомные домены</a>
    <a href="/domains" {% if request.url.path.startswith('/domains') %}class="active"{% endif %}>Домены (тест)</a>
    <div class="group-label">Управление</div>
    <a href="/controls" {% if request.url.path == '/controls' %}class="active"{% endif %}>Стратегии</a>
    <a href="/controls/automation" {% if request.url.path.startswith('/controls/automation') %}class="active"{% endif %}>Автоматизация</a>
    <div class="spacer"></div>
    {% if user %}<div class="user">{{ user }} · <a href="/logout">выйти</a></div>{% endif %}
  </aside>
  <div class="content-area">
    <main>
    {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script>
  document.addEventListener("click", function (e) {
    var el = e.target.closest(".blur");
    if (el) el.classList.toggle("revealed");
  });
</script>
</body>
</html>
